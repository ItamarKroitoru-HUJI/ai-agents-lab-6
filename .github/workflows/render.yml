name: Render video

on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Download Kokoro model files
        run: |
          mkdir -p models
          cd models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f kokoro-v1.0.onnx ] || curl -sSLO $base/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -sSLO $base/voices-v1.0.bin
      - run: pip install kokoro-onnx soundfile
      - name: Generate narration
        run: python tools/tts.py narration/lines.json public/narration
      - name: Install browser libraries Remotion needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Render with a new numbered file name
        run: |
          name=render-$(printf '%02d' ${{ github.run_number }}).mp4
          npx remotion render src/index.ts Video out/$name
          echo "RENDER=$name" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RENDER }}
          path: out/${{ env.RENDER }}
