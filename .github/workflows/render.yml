name: Render test clip

on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser libraries Remotion needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: npm install
      - run: npx remotion render src/index.ts TestClip out/test-clip.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: test-clip
          path: out/test-clip.mp4
